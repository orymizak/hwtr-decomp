# Uploads the progress report for ByteMatch (https://bytematch.dev/orymizak/hwtr-decomp).
# The ROM is not distributable, so CI does not build: report/us/report.json is generated
# locally with `make report` and committed.
name: Progress report

on:
  push:
    branches: [main]

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: report/us/report.json
          if-no-files-found: error
